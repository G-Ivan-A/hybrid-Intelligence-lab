name: "📋 Task"
description: "Универсальный 5-блочный шаблон задачи: Structured, Creative или Hybrid."
title: "[scope] Краткое описание задачи"
labels:
  - tools
  - governance
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Для ИИ**: пустое поле не заполняется выдуманным значением. Универсальные контракты автономии, эскалации и верификации живут в `ai-rules/agent-work-rules.md` и здесь не дублируются. Список файлов не перечисляется: место артефакта разрешается на момент исполнения. Источник шаблона — RFC #470, §P.9.

  - type: dropdown
    id: operating_mode
    attributes:
      label: "Operating Mode"
      description: "Уровень автономии. Default: structured, если не указано."
      options:
        - structured
        - creative
        - hybrid
      default: 0
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: "Task Type"
      description: "Опциональный тип задачи; независимая ось, не определяет уровень автономии."
      options:
        - research
        - education
        - implementation
        - audit
        - analysis
        - rfc
        - adr
    validations:
      required: false

  - type: input
    id: user_story
    attributes:
      label: "User Story / ФТ / НФТ"
      description: "Одной строкой, опционально. Пусто — оставьте `—`."
      placeholder: "—"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "1. Контекст"
      description: "Зачем это делается, какие решения уже приняты, что НЕ входит в задачу."
      placeholder: |
        Принятые решения, границы, связанные issue / PR / документы.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: "2. Цель"
      description: "Какое состояние станет правдой после выполнения. Без описания реализации."
      placeholder: |
        После выполнения ...
    validations:
      required: true

  - type: textarea
    id: ssot
    attributes:
      label: "3. SSOT"
      description: "1–3 якоря: путь, issue/PR или permalink с SHA. Неразрешимый якорь фиксируется как gap."
      placeholder: |
        - ai-rules/agent-work-rules.md
        - #470
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: "4. Контракты задачи"
      description: "Только отклонения от универсальных контрактов `agent-work-rules.md` (автономия / эскалация / верификация). Пусто = действуют универсальные."
      placeholder: |
        —
    validations:
      required: false

  - type: textarea
    id: dod
    attributes:
      label: "5. Готово, когда"
      description: "3–5 пунктов, каждый проверяем."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: deviations
    attributes:
      label: "Отклонения от постановки"
      description: "Если агент отклоняется от явного указания о способе исполнения: что изменено, почему и как проверено. Если отклонений нет — `Нет`."
      placeholder: "Нет"
    validations:
      required: false

  - type: textarea
    id: incomplete_and_questions
    attributes:
      label: "Не выполнено и вопросы"
      description: "Для легального выхода: что не сделано, почему, варианты решения и рекомендация агента. Если блок не применим — `Нет`."
      placeholder: "Нет"
    validations:
      required: false
