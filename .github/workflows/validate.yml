name: validate

on:
  push:
  pull_request:

permissions:
  contents: read
  # Нужны для чтения timeline PR: кто поставил escape-метку no-diff-expected.
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история обязательна: без неё нет merge-base и three-dot diff невозможен.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        # Валидатор и локальный runner используют зависимости пакета исполнения.
        run: pip install -r projects/ba-ai-process/dist/execution-package-gigacode-cli/requirements.txt


      - name: Validate shell syntax
        run: bash -n tools/*.sh templates/htom/tools/*.sh templates/spoke/tools/*.sh

      - name: Test frontmatter validator
        run: bash tools/test-frontmatter-validator.sh

      - name: Test Mango kb migration contract
        run: bash tools/test-mango-kb-migration-contract.sh

      - name: Test evidence structure validator
        run: bash tools/test-evidence-structure-validator.sh

      - name: Test reference research terminology
        run: bash tools/test-reference-research-terminology.sh

      - name: Test smart sync
        run: bash tools/test-smart-sync.sh

      - name: Test post-migration validator invariants
        run: bash tools/test-post-migration-validator.sh

      - name: Test Sprint 5 agent-model contracts
        run: bash tools/test-sprint-5-agent-model.sh

      - name: Test agent onboarding authorization contract
        run: bash tools/test-agent-onboarding-authorization.sh

      - name: Test operating mode contract
        run: bash tools/test-operating-mode-contract.sh

      - name: Test agent work rules size check
        run: bash tools/test-check-agent-work-rules-size.sh

      - name: Test nonempty diff validator
        run: bash tools/test-nonempty-diff.sh

      - name: Test historical immutability validator
        run: bash tools/test-historical-immutable.sh

      - name: Test RRP link validator
        run: bash tools/test-validate-rrp-links.sh

      - name: Test BA meta-model stakeholder overview
        run: bash tools/test-ba-meta-model-overview.sh

      - name: Test BCREQ Working/Release pipeline contract
        run: bash tools/test-bcreq-working-release-pipeline.sh

      - name: Test AGENTS.md physical integration
        run: bash tools/test-agents-md-integration.sh

      - name: Test execution package gate
        env:
          # Блоки инструкций БА исполняются в PowerShell 7; без pwsh тест падает, а не пропускается.
          GUIDE_SHELL: pwsh
        run: bash tools/test-execution-package.sh

      - name: Test Cline execution package
        run: bash tools/test-cline-package.sh

      - name: Test OpenCode execution package
        run: bash tools/test-opencode-package.sh

      - name: Check presentation UX coverage and preservation
        run: python3 research/reputation-technologies/exp/presentation-ux-665/check-presentation-ux.py --self-test

      - name: Check Days 1-3 logic RFC contract
        run: python3 -I research/reputation-technologies/exp/rfc-days-logic-667/check-rfc-logic.py --self-test

      - name: Check Day 2 against RFC v0.3
        run: python3 -I research/reputation-technologies/exp/day2-rebuild-673/check-day2.py --self-test

      - name: Check Day 1 against RFC v0.3
        run: python3 -I research/reputation-technologies/exp/day1-rebuild-675/check-day1.py --self-test

      - name: Check Day 1 deck, lecturer script and gate of #677
        run: python3 -I research/reputation-technologies/exp/day1-rebuild-677/check-day1-677.py --self-test

      - name: Check Day 2 Gamma deck and lecturer script of #679
        run: python3 -I research/reputation-technologies/exp/day2-gamma-679/check-day2-679.py --self-test

      - name: Check Day 3 Gamma deck, lecturer script and gate of #681
        run: python3 -I research/reputation-technologies/exp/day3-gamma-681/check-day3-681.py --self-test

      - name: Check Day 4 rationale and method slide structure and gate of #685
        run: python3 -I research/reputation-technologies/exp/day4-rationale-685/check-day4-685.py --self-test

      - name: Check Day 4 Gamma deck and lecturer script of #687
        run: python3 -I research/reputation-technologies/exp/day4-gamma-687/check-day4-687.py --self-test
      - name: Check Day 4 correction files and unchanged Variant 1 of #689
        run: python3 -I research/reputation-technologies/exp/day4-correction-689/check-day4-689.py --self-test

      - name: Check Day 4 Variant 3 deck and lecturer script of #691
        run: python3 -I research/reputation-technologies/exp/day4-v3-691/check-day4-691.py --self-test

      - name: Check Day 4 Variant 4 hypothesis-map deck and image-technologies module of #693
        run: python3 -I research/reputation-technologies/exp/day4-v4-693/check-day4-693.py --self-test

      - name: Check Day 4 Variant 5 point-diff RFC against the unchanged v4 deck of #695
        run: |
          python3 -I research/reputation-technologies/exp/rfc-v5-695/check-rfc-695.py --self-test
          python3 -I research/reputation-technologies/exp/rfc-v5-695/build-rfc-695.py
          git diff --exit-code -- research/reputation-technologies/2026-11-03-rfc-presentation-update-v5.md

      - name: Check Day 4 Variant 5 deck and lecturer script of #697
        run: python3 -I research/reputation-technologies/exp/day4-v5-697/check-day4-697.py --self-test

      - name: Check Day 4 image prompts v5 couturier constructor of #699
        run: python3 -I research/reputation-technologies/exp/day4-image-prompts-v5-699/check-day4-image-prompts-699.py --self-test

      - name: Check Day 3 rationale v0.3 of #683
        run: python3 -I research/reputation-technologies/exp/day3-rationale-683/check-day3-rationale-683.py --self-test

      - name: Resolve no-diff-expected label authorization
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'no-diff-expected')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labeler="$(gh api "repos/$REPO/issues/$PR_NUMBER/timeline" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "no-diff-expected")] | last | .actor.login' \
            2>/dev/null || true)"
          role=""
          if [ -n "$labeler" ] && [ "$labeler" != "null" ]; then
            if [ "$labeler" = "$REPO_OWNER" ]; then
              role="OWNER"
            else
              permission="$(gh api "repos/$REPO/collaborators/$labeler/permission" --jq '.permission' 2>/dev/null || true)"
              [ "$permission" = "admin" ] && role="ADMIN"
            fi
          fi
          echo "Метку no-diff-expected поставил: ${labeler:-неизвестно} (роль: ${role:-не авторизована})"
          echo "NO_DIFF_LABEL_ACTOR_ROLE=$role" >>"$GITHUB_ENV"

      - name: Validate nonempty diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./tools/validate-nonempty-diff.sh

      - name: Validate historical documents immutability
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: ./tools/validate-historical-immutable.sh

      - name: Check agent work rules size budget
        run: ./tools/check-agent-work-rules-size.sh

      - name: Validate frontmatter
        run: ./tools/validate-frontmatter.sh .

      - name: Validate file naming
        run: ./tools/validate-file-naming.sh

      - name: Validate repository structure
        run: ./tools/validate-repository-structure.sh

      - name: Validate RRP practice-to-theory links
        run: ./tools/validate-rrp-links.sh

      - name: Validate template manifest
        run: python3 tools/generate-manifest.py --check

      - name: Validate MVP BCREQ execution package (G-mach)
        run: sh projects/ba-ai-process/dist/execution-package-gigacode-cli/tools/validate-package.sh

  cline-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check compiled Cline package
        run: python projects/ba-ai-process/build/compile-cline-package.py --check
      - name: Test Cline Windows hooks, paths, and runner
        run: python projects/ba-ai-process/tests/cline-package/test_package.py
      - name: Run Cline guide commands verbatim in Git Bash
        # БА работает в терминале Git Bash из Git for Windows; блоки ```bash руководств исполняются дословно.
        shell: bash
        env:
          GUIDE_BASH: C:\Program Files\Git\bin\bash.exe
        run: python projects/ba-ai-process/tests/cline-package/test_guides_bash.py

  opencode:
    # The OpenCode pilot runs on Windows 10/11 x64; the real OpenCode binary drives the
    # guard plugin, permission rules and package commands against a scripted mock model.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check compiled OpenCode package
        run: python projects/ba-ai-process/build/compile-opencode-package.py --check
      - name: Test OpenCode guard, package commands, paths, and runner
        run: python projects/ba-ai-process/tests/opencode-package/test_package.py
      - name: Install OpenCode 1.18.35
        run: npm install -g opencode-ai@1.18.35
      - name: Run real OpenCode against the package (E2E)
        shell: bash
        run: |
          binary="$(npm root -g)/opencode-ai/bin/opencode"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" --version
          python projects/ba-ai-process/experiments/issue_652_opencode_e2e.py \
            projects/ba-ai-process/dist/execution-package-opencode --opencode "$binary"

  windows-guides:
    # Целевая среда БА — Windows 10/11 (x64): инструкции пакета GigaCode исполняются
    # дословно в Windows PowerShell 5.1 и PowerShell 7 на клоне с настройками Git for Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        # pywinpty даёт runner настоящую консоль для ввода строки APPROVE.
        run: python -m pip install -r projects/ba-ai-process/dist/execution-package-gigacode-cli/requirements.txt pywinpty

      - name: Validate GigaCode package (G-mach)
        run: python projects/ba-ai-process/dist/execution-package-gigacode-cli/tools/validate-package.py

      # Каждая команда — отдельный шаг: многострочный pwsh-шаг падает только по коду последней.
      - name: Test GigaCode package gate (G-mach negatives, BCREQ compile)
        run: python projects/ba-ai-process/tests/execution-package/tests/test_package_gate.py

      - name: Test GigaCode route emulation
        run: python projects/ba-ai-process/tests/execution-package/tests/test_emulation.py

      - name: Test GigaCode semantic regression
        run: python projects/ba-ai-process/tests/execution-package/tests/test_semantic_regression.py

      - name: Test GigaCode runner
        run: python projects/ba-ai-process/tests/execution-package/tests/test_runner.py

      - name: Execute BA guides in ${{ matrix.shell }}
        env:
          GUIDE_SHELL: ${{ matrix.shell }}
        run: python projects/ba-ai-process/tests/execution-package/tests/test_guides.py

      - name: Run issue 638 smoke guide experiment in ${{ matrix.shell }}
        env:
          GUIDE_SHELL: ${{ matrix.shell }}
        run: python projects/ba-ai-process/experiments/issue_638_gigacode_smoke_guide.py

      - name: Run issue 638 input checks experiment
        run: python projects/ba-ai-process/experiments/issue_638_gigacode_input_checks.py

      - name: Run issue 638 smoke flow experiment
        run: python projects/ba-ai-process/experiments/issue_638_gigacode_smoke_flow.py

      - name: Run issue 638 full route experiment in ${{ matrix.shell }}
        env:
          GUIDE_SHELL: ${{ matrix.shell }}
        run: python projects/ba-ai-process/experiments/issue_638_gigacode_full_route.py
