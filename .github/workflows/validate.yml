name: validate

on:
  push:
  pull_request:

permissions:
  contents: read
  # Нужны для чтения timeline PR: кто поставил escape-метку no-diff-expected.
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история обязательна: без неё нет merge-base и three-dot diff невозможен.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate shell syntax
        run: bash -n tools/*.sh templates/htom/tools/*.sh templates/spoke/tools/*.sh

      - name: Test frontmatter validator
        run: bash tools/test-frontmatter-validator.sh

      - name: Test Mango kb migration contract
        run: bash tools/test-mango-kb-migration-contract.sh

      - name: Test evidence structure validator
        run: bash tools/test-evidence-structure-validator.sh

      - name: Test reference research terminology
        run: bash tools/test-reference-research-terminology.sh

      - name: Test smart sync
        run: bash tools/test-smart-sync.sh

      - name: Test post-migration validator invariants
        run: bash tools/test-post-migration-validator.sh

      - name: Test Sprint 5 agent-model contracts
        run: bash tools/test-sprint-5-agent-model.sh

      - name: Test agent onboarding authorization contract
        run: bash tools/test-agent-onboarding-authorization.sh

      - name: Test operating mode contract
        run: bash tools/test-operating-mode-contract.sh

      - name: Test agent work rules size check
        run: bash tools/test-check-agent-work-rules-size.sh

      - name: Test nonempty diff validator
        run: bash tools/test-nonempty-diff.sh

      - name: Test historical immutability validator
        run: bash tools/test-historical-immutable.sh

      - name: Test RRP link validator
        run: bash tools/test-validate-rrp-links.sh

      - name: Resolve no-diff-expected label authorization
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'no-diff-expected')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labeler="$(gh api "repos/$REPO/issues/$PR_NUMBER/timeline" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "no-diff-expected")] | last | .actor.login' \
            2>/dev/null || true)"
          role=""
          if [ -n "$labeler" ] && [ "$labeler" != "null" ]; then
            if [ "$labeler" = "$REPO_OWNER" ]; then
              role="OWNER"
            else
              permission="$(gh api "repos/$REPO/collaborators/$labeler/permission" --jq '.permission' 2>/dev/null || true)"
              [ "$permission" = "admin" ] && role="ADMIN"
            fi
          fi
          echo "Метку no-diff-expected поставил: ${labeler:-неизвестно} (роль: ${role:-не авторизована})"
          echo "NO_DIFF_LABEL_ACTOR_ROLE=$role" >>"$GITHUB_ENV"

      - name: Validate nonempty diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./tools/validate-nonempty-diff.sh

      - name: Validate historical documents immutability
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: ./tools/validate-historical-immutable.sh

      - name: Check agent work rules size budget
        run: ./tools/check-agent-work-rules-size.sh

      - name: Validate frontmatter
        run: ./tools/validate-frontmatter.sh .

      - name: Validate file naming
        run: ./tools/validate-file-naming.sh

      - name: Validate repository structure
        run: ./tools/validate-repository-structure.sh

      - name: Validate RRP practice-to-theory links
        run: ./tools/validate-rrp-links.sh

      - name: Validate template manifest
        run: python3 tools/generate-manifest.py --check
