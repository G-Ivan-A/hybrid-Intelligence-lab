# Граф маршрута вертикального среза MVP: A-IN → A-CORE → A-BCREQ с ветвью
# уточнения. Граф описывает ВСЕ допустимые пути; прогон — одна траектория по
# нему (EP-R3). Изменение графа — новая версия процесса между прогонами;
# пройденный лист прогона не правится никогда.
route_graph_id: RG-BCREQ-v1
version: "1.0"
processes: [P-01, P-02, P-03]     # значения закрытого словаря taxonomy/processes.yaml (EP-R1)
product_class: contact-center     # объявлен до начала (PT-1/MM-4)
interaction: single-pass
input_artifact: A-IN
input_contract: contracts/c-in.schema.json
output_artifact: A-BCREQ
output_contract: contracts/c-out-bcreq.schema.json
# Узел без скомпилированного навыка обязан нести actor: human и агенту не
# выдаётся (EP-R2). В этом графе такой узел один: n5 — отправка вопросов
# Заказчику, действие необратимое и потому не ниже яруса G5.
nodes:
  - {node: n1, process: P-01, skill: SK-transcript-normalization, actor: agent, gates: [G-self, G-mach], output: normalized_text}
  - {node: n2, process: P-01, skill: SK-context-extraction, actor: agent, gates: [G-self, G-mach], output: marked_elements}
  - {node: n3, process: P-01, skill: SK-ambiguity-detection, actor: agent, gates: [G-self, G-mach], output: ambiguities}
  - {node: n4, process: P-01, skill: SK-core-assembly, actor: agent, gates: [G-self, G-mach, G-human], output: A-CORE, note: "человек подтверждает набор источников и каждую используемую цитату до перехода дальше"}
  - {node: n5, process: P-02, skill: SK-question-formation, actor: agent, gates: [G-self, G-mach], output: A-QUEST}
  - {node: n6, process: P-02, skill: SK-question-prioritization, actor: agent, gates: [G-self, G-mach], output: A-QUEST}
  - {node: n7, process: P-02, skill: send-questions-to-customer, actor: human, gates: [G-human], output: answers, note: "скомпилированного навыка нет: отправка вовне необратима (GT-6, не ниже G5). Форма исполнения — диалог: агент прерывает исполнение, печатает вопрос, ждёт ответа и продолжает; ответ становится источником уровня ST-4-HUMAN"}
  - {node: n8, process: P-02, skill: SK-answer-integration, actor: agent, gates: [G-self, G-mach, G-human], output: A-CORE}
  - {node: n9, process: P-03, skill: SK-problem-statement, actor: agent, gates: [G-self, G-mach], output: problem_statement}
  - {node: n10, process: P-03, skill: SK-value-hypothesis, actor: agent, gates: [G-self, G-mach], output: value_hypothesis}
  - {node: n11, process: P-03, skill: SK-bcreq-decomposition, actor: agent, gates: [G-self, G-mach], output: bcreq_items}
  - {node: n12, process: P-03, skill: SK-bcreq-assembly, actor: agent, gates: [G-self, G-mach, G-human], output: A-BCREQ}
# Каждое ребро с условием несёт предикат по объявленному выходу узла-источника
# (EP-R5). Ребро «по усмотрению» запрещено: оно делает траекторию
# невоспроизводимой.
edges:
  - {from: entry, to: n1, condition: "c_in.valid == true"}
  - {from: entry, to: refuse, condition: "c_in.valid == false"}
  - {from: n1, to: n2, condition: gate_passed}
  - {from: n2, to: n3, condition: gate_passed}
  - {from: n3, to: n4, condition: gate_passed}
  - {from: n4, to: n5, condition: "ambiguities[severity == 'blocker'].count > 0"}
  - {from: n4, to: n9, condition: "ambiguities[severity == 'blocker'].count == 0"}
  - {from: n5, to: n6, condition: gate_passed}
  - {from: n6, to: n7, condition: gate_passed}
  - {from: n7, to: n8, condition: "answers.count > 0"}
  - {from: n7, to: halt, condition: "answers.count == 0", note: "маршрут остановлен до ответа Заказчика: ожидание — ребро графа, а не пауза внутри навыка. До вопроса проверяются дополняющие каналы ST-2-CORPUS и ST-3-PRODUCT-DOC, а найденные цитаты подтверждаются человеком"}
  - {from: n8, to: n9, condition: "ambiguities[severity == 'blocker' and resolved == false].count == 0"}
  - {from: n8, to: n5, condition: "ambiguities[severity == 'blocker' and resolved == false].count > 0"}
  - {from: n9, to: n10, condition: gate_passed}
  - {from: n10, to: n11, condition: gate_passed}
  - {from: n11, to: n12, condition: gate_passed}
  - {from: n12, to: exit, condition: gate_passed}
# Любой reject G-mach останавливает автоматическое исполнение и возвращает
# решение человеку. Скрытая корректирующая попытка запрещена (EP-R7).
gate_policy:
  order: [G-self, G-mach, G-human]
  fail_closed: true
  corrective_attempts: 0
  on_reject: halt_and_request_human
trace:
  required: [seq, at, event_type, actor, input_ref, output_ref, source_refs]
