# Закрытый словарь уровней источников знания. Отвечает на вопрос «откуда брать
# факт и что считать доказательством», который до сих пор в пакете не был
# объявлен ни одним контрактом. Значение вне словаря — отказ на входе (T-1).
#
# Словарь намеренно короче семиуровневой отраслевой иерархии: в срез входят
# только те уровни, для которых объявлена форма доказательства и достижима
# готовность корпуса. Уровни вне среза перечислены явно в `out_of_slice`, чтобы
# ни одна ветка маршрута не осталась необъявленной.
vocabulary: source-tiers
closed: true
version: "2.0"

# Локальная KB и Confluence — дополняющие каналы (AND/OR по задаче), а не
# последовательный fallback. Даже найденная цитата становится фактом только
# после явного подтверждения человеком.
collection_mode: complementary
confirmation_gate: G-human
citation_fields: [title, section, page_or_anchor, quote, locator]

# Готовность корпуса (унаследованная лестница L0–L5, накопительная):
# L0 хаос, L1 инвентаризован, L2 извлекаем, L3 структурирован,
# L4 согласован, L5 измерим. Стратегия допустима только на своём уровне.
readiness_scale: [L0, L1, L2, L3, L4, L5]
slice_readiness: L2
slice_strategy: S2   # извлечение по подготовленному корпусу с обязательной цитатой;
                     # стратегии, требующие L4–L5, в срез не входят

# Формы доказательства. Утверждение без доказательства фактом не является
# (правило 3 AGENTS.md); уровень источника задаёт, какая форма обязательна.
evidence_forms:
  - id: EF-INLINE
    meaning: дословный текст источника вклеен во вход прогона
    required_fields: [locator, content]
  - id: EF-QUOTE
    meaning: источник извлечён во время прогона, во вход попадает дословная цитата с отметкой времени
    required_fields: [locator, quote, retrieved_at]

tiers:
  - id: ST-1-ATTACHED
    name: Материал задачи
    meaning: расшифровка, письмо, заявка или экспорт, приложенные к задаче
    evidence_form: EF-INLINE
    min_readiness: L0
    in_slice: true
    rationale: материал существует только в контексте задачи, извлекать его неоткуда

  - id: ST-2-CORPUS
    name: Подготовленный корпус базы знаний
    meaning: корпус спутника, прошедший инвентаризацию и разметку (готовность не ниже L2)
    evidence_form: EF-QUOTE
    min_readiness: L2
    in_slice: true
    rationale: >-
      проверяемый факт продукта обязан браться отсюда, а не превращаться в
      вопрос Заказчику; отсутствие этого уровня измерено как остановка маршрута
      там, где останавливаться не должен

  - id: ST-3-PRODUCT-DOC
    name: Документация продукта
    meaning: опубликованное описание поведения продукта, доступное спутнику
    evidence_form: EF-QUOTE
    min_readiness: L1
    in_slice: true
    rationale: описывает фактическое поведение, но не отражает незадокументированные настройки

  - id: ST-4-HUMAN
    name: Ответ человека
    meaning: ответ Заказчика или эксперта, полученный гейтом G-human
    evidence_form: EF-INLINE
    min_readiness: L0
    in_slice: true
    rationale: "последний уровень, а не первый: применяется, когда предыдущие уровни факта не дали"

out_of_slice:
  - id: ST-X-SYSTEM
    name: Внешняя система
    why: >-
      производственная система, кроме разрешённого read-only Confluence MCP,
      требует отдельных прав и может вызвать необратимое действие
  - id: ST-X-ADHOC
    name: Ad-hoc поиск
    why: доказательство невоспроизводимо, отметка времени не гарантирует повторяемость цитаты
  - id: ST-X-TOOL
    name: Внешний инструмент по протоколу
    why: >-
      произвольный инструмент вне локальной KB и объявленного в
      .gigacode/settings.json Confluence MCP не имеет контракта в этом срезе

# Порядок ниже разрешает конфликт доказательств и эскалацию, но не задаёт
# последовательный поиск: ST-2 и ST-3 опрашиваются как дополняющие каналы.
order: [ST-1-ATTACHED, ST-2-CORPUS, ST-3-PRODUCT-DOC, ST-4-HUMAN]

conflict_rule: >-
  При расхождении источников выигрывает уровень с меньшей стоимостью ошибки,
  затем более свежий, и только затем более быстрый (M2 > M3 > M1). Задержка
  никогда не перевешивает стоимость ошибки: сокращение прогона за счёт
  непроверенного факта — дефект, а не оптимизация.

escalation_rule: >-
  ST-2-CORPUS и ST-3-PRODUCT-DOC проверяются совместно в доступной комбинации.
  Человек подтверждает title, section, page_or_anchor, quote и locator каждого
  используемого источника; если факт не подтверждён или каналы расходятся,
  маршрут останавливается на G-human.

investment_rule: >-
  Готовность корпуса имеет приоритет над усложнением конвейера: подъём корпуса
  с L1 до L2 снимает больше остановок маршрута, чем любая доработка стратегии
  извлечения на том же корпусе.
