# Закрытый словарь классов артефактов. Значение вне словаря — отказ на входе (T-1).
# Расширение словаря выполняется задачей Хаба с указанием непокрытого случая (T-2).
vocabulary: artifacts
closed: true
version: "1.0"
states: [raw, draft, in-review, validated, approved, baselined, needs-clarification]
state_rule: >-
  Состояние жизненного цикла — атрибут артефакта, а не класс и не граница
  процесса (A-2). «Черновик ФТ» выходом не является: выход — класс в состоянии.
unclassified_rule: >-
  Артефакт, не отнесённый ни к одному классу, выходом шага не является (A-0):
  он либо промежуточное состояние внутри шага, либо дефект объявления.
items:
  - id: A-IN
    name: Входной артефакт
    acceptance: >-
      сырой материал до анализа: расшифровка встречи, письмо, заявка на
      изменение. Документом требований не является и проверке качества
      требований не подлежит.
    role: вход маршрута
    in_slice: true
  - id: A-CORE
    name: Ядро требований
    acceptance: >-
      машиночитаемый промежуточный контракт: размеченные сущности, акторы,
      утверждения, ограничения и ссылки на источник. Читаемой формы как цели не
      имеет; из него собираются проекции.
    role: ядро маршрута
    schema: contracts/c-core.schema.json
    in_slice: true
  - id: A-QUEST
    name: Вопросы Заказчику
    acceptance: >-
      перечень вопросов, каждый из которых снимается одним фактом и привязан к
      одной неоднозначности A-CORE. Отправка вовне необратима и удерживается
      человеческим гейтом.
    role: выход процесса уточнения
    in_slice: true
  - id: A-BCREQ
    name: Бизнес-требование к изменению
    acceptance: >-
      ценность, проблема и решение верхнего уровня для оценки целесообразности:
      отвечает на «зачем» и «что», но не на «как».
    role: целевой артефакт среза
    schema: contracts/c-out-bcreq.schema.json
    in_slice: true
  - id: A-TRACE
    name: След прослеживаемости
    acceptance: >-
      материализованная матрица или граф сквозной прослеживаемости: источник
      (цитата) → элемент A-CORE → элемент требования → критерий приёмки.
      Содержит ссылку на неизменяемый лист прогона. Не является техническим
      журналом и не является памятью чата.
    role: служебный артефакт каждого прогона
    in_slice: true
  - id: A-FR
    name: Функциональные требования
    acceptance: >-
      спецификация поведения целевой Системы: атомарные требования с критериями
      приёмки, качество по ISO/IEC/IEEE 29148:2018. ТЗ не является.
    role: результирующий документ
    in_slice: false
  - id: A-TZ
    name: Техническое задание
    acceptance: составной документ по внешнему эталону структуры (ГОСТ 34.602-2020 или внутренний стандарт).
    role: результирующий документ
    in_slice: false
  - id: A-US
    name: Пользовательские истории
    acceptance: проекция требований в форму истории с ценностью для актора.
    role: результирующий документ
    in_slice: false
  - id: A-UC
    name: Сценарии использования
    acceptance: проекция требований в форму сценария с актором, триггером и потоками.
    role: результирующий документ
    in_slice: false
  - id: A-SPEC
    name: Техническая спецификация
    acceptance: требования к системе в терминах реализации; лежит на границе роли БА.
    role: результирующий документ
    in_slice: false
  - id: A-DIAG
    name: Диаграмма (UML/BPMN)
    acceptance: проекция существующей модели в нотацию; элемента, которого нет в модели, в диаграмме быть не может.
    role: производный артефакт
    in_slice: false
  - id: A-REP
    name: Аналитический или оценочный отчёт
    acceptance: суждение о чужом или собственном материале с перечнем оснований.
    role: производный артефакт
    in_slice: false
