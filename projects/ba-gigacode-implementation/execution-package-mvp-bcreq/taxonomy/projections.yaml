# Закрытый словарь проекций документа A-BCREQ. Проекция — чтение одного и того
# же артефакта, а не отдельный артефакт: скелет из 14 слотов присутствует
# всегда, проекция задаёт, какие слоты обязаны быть раскрыты для адресата и
# какая формулировка требования для него обязательна.
#
# До введения этого словаря поле `projection` существовало в контракте выхода,
# но не производилось ни одним навыком и не проверялось: объявленная ветка ни
# разу не исполнялась. Словарь закрывает эту пустую ветку.
vocabulary: projections
closed: true
version: "1.0"
rule: >-
  Проекции не являются отдельными артефактами (R-5). Состав слотов не меняется
  ни в одной проекции; меняется обязательность раскрытия и требуемая
  формулировка. Документ объявляет ровно одну проекцию: два адресата в одном
  чтении — дефект, неотличимый от F-MIXED.

items:
  - id: V-BIZ
    name: Чтение для бизнеса
    addressee: заказчик изменения и владелец продукта
    question: "зачем это изменение и что мы получим"
    required_slots: [S-GLOSSARY, S-PROBLEM, S-SCOPE, S-SOLUTION, S-LIMITS, S-OPEN]
    wording_rule: >-
      язык предметной области без системных терминов; требование допускается в
      форме цели, а не поведения системы
    default_format_class: F-SHORT

  - id: V-APPROVE
    name: Чтение для согласования
    addressee: заказчик, утверждающий решение
    question: "что именно я утверждаю"
    # Разделы 1–6 документа: глоссарий, проблема, дельта, решение,
    # верхнеуровневые ФТ и то, как это выглядит для пользователя.
    required_slots: [S-GLOSSARY, S-PROBLEM, S-SCOPE, S-SOLUTION, S-FR, S-SETTINGS, S-UI, S-SCENARIO, S-NFR, S-LIMITS, S-OPEN]
    key_slots: [S-FR, S-SCENARIO, S-UI]
    wording_rule: >-
      S-FR несёт верхнеуровневые функциональные требования с идентификатором
      ФТ-NN — классическое «что система должна делать». S-SCENARIO и S-UI
      отвечают на «как это будет выглядеть» на языке заказчика: необходимо и
      достаточно для утверждения решения, без избыточной детализации. Каждый
      сценарий сопоставлен хотя бы одному ФТ-NN; сценарий без ФТ — дефект
      покрытия. Приоритет — читаемость: бюрократические обороты сокращаются.
    default_format_class: F-APPROVAL

  - id: V-DEV
    name: Чтение для разработки
    addressee: разработчик, архитектор, тестировщик
    question: "что именно и с какими значениями реализовать"
    required_slots: [S-GLOSSARY, S-PROBLEM, S-SCOPE, S-SOLUTION, S-FR, S-SETTINGS, S-UI, S-SCENARIO, S-AC, S-NFR, S-LIMITS, S-OPEN, S-TRACE, S-INTEGRATION]
    key_slots: [S-AC, S-TRACE, S-INTEGRATION]
    # Раздел 7 документа: детализация, которой нет в чтении для согласования.
    detail_subsections:
      - id: D-MODEL
        name: Моделирование решения
        content: состояния, переходы, правила расчёта
      - id: D-CASES
        name: Сценарии и истории
        content: use case и user story в разворачиваемой форме
      - id: D-COVERAGE
        name: Матрица покрытия ФТ ↔ сценарий
        content: каждое ФТ-NN сопоставлено хотя бы одному сценарию, каждый сценарий — хотя бы одному ФТ-NN
      - id: D-SPEC
        name: Техническая спецификация доработки
        content: >-
          значения по умолчанию, статусы, настройки, пагинации, сортировки,
          информационные подсказки и прочие умолчания интерфейса; умолчание,
          не объявленное здесь, будет придумано разработчиком
    wording_rule: >-
      требование формулируется как проверяемое поведение системы; каждое ФТ-NN
      имеет строку следа требование → ядро → источник → критерий приёмки
    default_format_class: F-CLASSIC

  - id: V-CONTRACT
    name: Чтение для технического задания
    addressee: сторона договора
    question: "что мы обязаны предоставить по договору"
    required_slots: [S-GLOSSARY, S-PROBLEM, S-SCOPE, S-SOLUTION, S-FR, S-SETTINGS, S-UI, S-SCENARIO, S-AC, S-NFR, S-LIMITS, S-TRACE]
    key_slots: [S-FR, S-AC]
    wording_rule: >-
      обязательная формулировка обязательства: «Система должна предоставлять
      ВОЗМОЖНОСТЬ …». Каждое ФТ-NN проверяется на договорную полноту по четырём
      вопросам: что, кто, где, когда. Ответ, отсутствующий хотя бы на один из
      них, делает требование неисполнимым по договору и отвергается гейтом.
    completeness_questions: [что, кто, где, когда]
    empty_slot_rule: >-
      S-OPEN в этой проекции обязан быть пуст: открытый вопрос в договорном
      документе — необъявленное обязательство
    default_format_class: F-CLASSIC
