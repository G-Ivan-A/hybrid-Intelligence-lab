# Метрики среза MVP. Базовая линия снимается первыми десятью прогонами; до
# этого значения не сравниваются ни с чем и целями не являются.
# Формула метрики записана так, чтобы её считал скрипт по листам прогона
# (contracts/c-rk.schema.json), а не человек по ощущению.
metrics:
  - id: M-1
    name: структурная воспроизводимость
    formula: "прогоны, чей скелет совпал с эталонным / все прогоны"
    source: сравнение подписей слотов выхода с golden/cases.yaml
    target: растёт
    baseline: 0
    baseline_note: "17 документов корпуса дали 17 различных скелетов"
  - id: M-2
    name: доля машинных отказов
    formula: "reject G-mach / все прогоны"
    source: счётчик гейта в листе прогона
    target: ненулевая
    reading: "нулевое значение означает, что гейт не проверяет"
  - id: M-3
    name: доля человеческих правок после G-mach
    formula: "правки на G-human / выходы, принятые G-mach"
    source: diff выхода до и после человеческого гейта
    target: падает
  - id: M-4
    name: полнота следа
    formula: "прогоны с заполненными trace.required / все прогоны"
    source: валидатор пакета
    target: 1.0
    reading: "условие приёма прогона: артефакт без происхождения в метриках не участвует"
  - id: M-5
    name: доля пустых слотов с объявленной причиной
    formula: "пустые слоты с причиной / все пустые слоты"
    source: разбор выхода по contracts/c-out-bcreq.schema.json
    target: 1.0
    reading: "отличает «нет по продукту» от «не рассматривали»"
  - id: MP-1
    name: дисциплина словаря
    formula: "шаги с процессом из L2 / все шаги прогона"
    target: 1.0
    reading: "ниже 1.0 — возврат к свободному тексту, агрегация по процессам невозможна"
  - id: MP-2
    name: покрытие источниками
    formula: "утверждения с валидной ссылкой / принятые утверждения"
    target: ">= 0.9 на входе человеческого гейта"
    reading: "ниже порога человеческий гейт вырождается в перечитывание входа"
  - id: MP-3
    name: машинная исполнимость
    formula: "процессы со скомпилированными навыками всех узлов / процессы среза"
    target: "1.0 для P-01, P-02, P-03"
  - id: MP-4
    name: восстановимость траектории
    formula: "прогоны с полной траекторией в листе прогона / все прогоны"
    target: ">= 0.95"
    reading: "ниже порога невычислимы MP-5 и MP-6"
  - id: MP-5
    name: цена человеческого гейта
    formula: "человеческие гейты, пройденные без возврата / все человеческие гейты"
    target: ">= 0.7"
    reading: "систематический возврат означает, что гейт стоит не в той точке маршрута"
  - id: MP-6
    name: работа машинного гейта
    formula: "выходы, отвергнутые G-mach / все выходы, дошедшие до гейта"
    target: "0.1–0.4"
    reading: "около нуля — гейт не проверяет; выше 0.4 — навык систематически не выполняет контракт"
