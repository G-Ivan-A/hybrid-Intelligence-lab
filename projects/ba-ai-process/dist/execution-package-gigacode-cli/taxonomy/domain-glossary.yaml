# Версионированный глоссарий предметной области contact-center.
# Назначение в исполнении — два контракта:
#   1. Слот S-GLOSSARY документа заполняется только терминами этого словаря
#      (термин вне словаря = открытый вопрос, а не собственное определение).
#   2. Пары `confusable_with` — источник негативных случаев Golden Set (EP-G7):
#      правдоподобная подмена термина близким обязана быть отвергнута, а не
#      «исправлена по смыслу». Пара не изобретается в тесте, она берётся отсюда.
vocabulary: domain-glossary
closed: false            # каталог значений растёт в споке; форма записи закрыта
product_class: contact-center
version: "1.0"
required_fields: [id, term, definition, confusable_with]
terms:
  - id: TRM-INBOUND
    term: Входящие
    aliases: [входящая линия, входящие обращения, inbound]
    definition: >-
      поток обращений, инициированных абонентом в адрес контакт-центра;
      распределяется правилами маршрутизации на группы операторов.
    confusable_with:
      - term: ИО
        why: >-
          «ИО» в корпусе Манго означает «исходящий обзвон» — поток, инициированный
          контакт-центром. Сокращение графически близко к «Входящие обращения»,
          и подстановка меняет направление потока, а с ним — всю логику
          маршрутизации и отчётности.
  - id: TRM-OUTBOUND
    term: ИО
    aliases: [исходящий обзвон, исходящие, outbound]
    definition: >-
      поток вызовов, инициированных контакт-центром в адрес абонента по
      загруженному списку; управляется режимом набора и правилами перезвона.
    confusable_with:
      - term: Входящие
        why: противоположное направление потока при графически близком сокращении
  - id: TRM-QUEUE
    term: Очередь
    aliases: [очередь распределения]
    definition: >-
      упорядоченный набор ожидающих обращений одной группы с правилом выбора
      следующего обращения и порогом ожидания.
    confusable_with:
      - term: Группа
        why: >-
          группа — множество операторов, очередь — множество обращений; подмена
          переносит требование с людей на обращения и обратно.
  - id: TRM-GROUP
    term: Группа
    aliases: [группа операторов, отдел]
    definition: множество операторов с общими правами и общим правилом распределения обращений.
    confusable_with:
      - term: Очередь
        why: см. TRM-QUEUE — разные предметы измерения и разные владельцы настройки
  - id: TRM-SLA
    term: SLA
    aliases: [уровень обслуживания, service level]
    definition: >-
      доля обращений, принятых в пределах объявленного порога ожидания, за
      объявленный период.
    confusable_with:
      - term: AHT
        why: >-
          SLA — про время до ответа, AHT — про длительность обработки; обе
          величины измеряются в секундах и подменяются в требованиях к отчётам.
  - id: TRM-AHT
    term: AHT
    aliases: [среднее время обработки, average handling time]
    definition: среднее время обработки одного обращения оператором, включая послеразговорную работу.
    confusable_with:
      - term: SLA
        why: см. TRM-SLA
  - id: TRM-IVR
    term: IVR
    aliases: [голосовое меню, интерактивное меню]
    definition: сценарий предварительного взаимодействия с абонентом до соединения с оператором.
    confusable_with:
      - term: Автоинформатор
        why: >-
          IVR принимает ввод абонента и ветвится, автоинформатор только
          воспроизводит сообщение; подмена убирает из требования ветвление.
  - id: TRM-ANNOUNCER
    term: Автоинформатор
    aliases: [голосовое сообщение]
    definition: однонаправленное воспроизведение сообщения абоненту без приёма ввода.
    confusable_with:
      - term: IVR
        why: см. TRM-IVR
