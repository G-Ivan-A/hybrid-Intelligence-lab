# Исполняемый контракт продуктовой маршрутизации. Значения цепочки не
# дублируются здесь: единственный закрытый каталог всего портфеля MANGO —
# taxonomy/mango-products.yaml. Профиль управляет заполненностью слотов, но не
# сужает допустимый продуктовый домен.
vocabulary: products
closed: true
version: "2.0"
scope: mango-portfolio
catalog: taxonomy/mango-products.yaml
industry_mapping: taxonomy/telecom-products.yaml
levels:
  - {id: Domain, field: domain, question: "К какому домену портфеля MANGO относится задача?"}
  - {id: Capability, field: capability, question: "Какую продуктовую способность затрагивает задача?"}
  - {id: Feature, field: feature, question: "Какой пользовательский или системный аспект способности затронут?"}
  - {id: Atomic Function, field: atomic_function, question: "Какая неделимая функция проверяется отдельно?"}
binding_level: Atomic Function
attribution:
  artifact: A-IN
  node: n0
  skill: SK-product-attribution
  confirmation_gate: G-human
  status_before_confirmation: pending
  status_after_confirmation: confirmed
  propagation_fields: [products, product_attribution]
  digest: "sha256 канонического JSON массива products (sort_keys=true, separators=',:')"
  reject_rule: "неразрешимая, неполная или неподтверждённая цепочка останавливает маршрут"
# Профиль управляет заполненностью слотов документа, но не составом скелета
# (правило PT-4/R-3): слот словаря присутствует всегда, различается значение
# «заполнен» или «пуст с причиной».
profiles:
  - {id: P-SETTINGS, meaning: "у функции есть пользовательская настройка", effect: "S-SETTINGS и S-UI заполнены"}
  - {id: P-NO-SETTINGS, meaning: "поведение задано продуктом", effect: "S-SETTINGS пуст с причиной «нет по продукту»"}
  - {id: P-DEVICE, meaning: "физическое устройство", effect: "S-UI пуст с причиной «нет по продукту», S-NFR расширен"}
  - {id: P-API, meaning: "функция без интерфейса пользователя", effect: "S-UI пуст, S-INTEGRATION обязателен"}
multi_product_rules:
  MP-1: одна задача — один документ, один скелет; число затронутых продуктов не влияет на состав и порядок слотов
  MP-2: каждая запись содержит marker, полную цепочку domain/capability/feature/atomic_function, profile и owner
  MP-3: бизнес-аналитик подтверждает весь реестр одним решением G-human до n1; агент не выводит подтверждение из текста
  MP-4: подтверждённые products и product_attribution передаются без изменения в A-CORE, A-QUEST, A-BCREQ и C-RK
  MP-5: слот заполнен, если он заполнен хотя бы для одного продукта; причина пустоты объявляется для каждого продукта отдельно
  MP-6: содержание слота, относящееся к конкретному продукту, помечается marker из подтверждённого реестра
