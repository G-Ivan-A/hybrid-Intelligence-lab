# Закрытый словарь продуктов среза. Ось идентичности — предмет, о котором
# требование. Форма уровней унаследована (Domain → Capability → Feature →
# Atomic Function); каталог значений принадлежит споку и расширяется в споке.
# Правило PT-1: продуктовый класс объявляется ДО начала шага и не выводится
# из текста артефакта. Шаг, получивший вход без объявленного класса, отказывает.
vocabulary: products
closed: true
version: "1.0"
levels:
  - {id: Domain, name: Семейство, question: "В какой продуктовой или сервисной зоне находится требование?"}
  - {id: Capability, name: Класс, question: "Какую способность должен иметь продукт или команда?"}
  - {id: Feature, name: Подкласс, question: "Что именно пользователь или администратор включает, настраивает или использует?"}
  - {id: Atomic Function, name: Функция, question: "Какую неделимую функцию, параметр или правило можно протестировать отдельно?"}
binding_level: Atomic Function   # PT-3: связь только с Domain считается неполной разметкой
classes:
  - {id: contact-center, name: Контакт-центр, default_profile: P-SETTINGS, in_slice: true}
  - {id: voice-ucaas, name: Телефония и UCaaS, default_profile: P-SETTINGS, in_slice: false}
  - {id: analytics-reporting, name: Аналитика и отчётность, default_profile: P-NO-SETTINGS, in_slice: false}
# Профиль управляет заполненностью слотов документа, но не составом скелета
# (правило PT-4/R-3): слот словаря присутствует всегда, различается значение
# «заполнен» или «пуст с причиной».
profiles:
  - {id: P-SETTINGS, meaning: "у функции есть пользовательская настройка", effect: "S-SETTINGS и S-UI заполнены"}
  - {id: P-NO-SETTINGS, meaning: "поведение задано продуктом", effect: "S-SETTINGS пуст с причиной «нет по продукту»"}
  - {id: P-DEVICE, meaning: "физическое устройство", effect: "S-UI пуст с причиной «нет по продукту», S-NFR расширен"}
  - {id: P-API, meaning: "функция без интерфейса пользователя", effect: "S-UI пуст, S-INTEGRATION обязателен"}
multi_product_rules:
  MP-1: одна задача — один документ, один скелет; число затронутых продуктов не влияет на состав и порядок слотов
  MP-2: продукты задачи объявляются до генерации реестром в S-PROBLEM — идентификатор, продуктовый класс, atomic function, профиль, владелец
  MP-3: слот заполнен, если он заполнен хотя бы для одного продукта задачи; причина пустоты объявляется для каждого продукта отдельно
  MP-4: содержание слота, относящееся к конкретному продукту, помечается маркером продукта из реестра MP-2
