# Спутник может быть развёрнут без доступа к Source-репозиторию (например, в GitVerse).
# Поэтому пакет содержит физические копии всего необходимого, а не ссылки.
deployment:
  mechanism: копирование каталога пакета в корень репозитория-спутника
  result: ".gigacode/, docs/kb/, meta-model/, taxonomy/, contracts/, routes/, templates/, golden/, evaluation/, runs/, tools/, AGENTS.md"
  source_access_required_at_runtime: false

# 1. Скопировано физически: содержание перенесено в пакет дословно или с
#    сокращением до применимого, без изменения смысла.
copied:
  - what: закрытые словари классов артефактов, процессов, операций и routing-профилей продуктов
    from: таксономии Source-репозитория https://github.com/G-Ivan-A/hybrid-Intelligence-lab
    to: [taxonomy/artifacts.yaml, taxonomy/processes.yaml, taxonomy/operations.yaml, taxonomy/products.yaml]
    note: перенесены все значения словарей; принадлежность срезу отмечена флагом in_slice, а не усечением словаря
  - what: полный снимок 42 продуктовых capabilities MANGO и 42 отраслевых соответствия ИТ/телеком
    from: https://github.com/G-Ivan-A/hybrid-Intelligence-lab/blob/3a7306d66011186d42f5017b89a9cc051226fe32/research/mango/2026-05-22-classification.md
    to: [taxonomy/mango-products.yaml, taxonomy/telecom-products.yaml]
    note: byte-identical копии Source используются как данные будущего product routing; действующий contact-center route ими ещё не управляется
  - what: перечень слотов, классов формата, проекций и продуктовых профилей
    from: исследование микроструктуры артефактов требований
    to: [contracts/c-out-bcreq.schema.json, templates/bcreq-skeleton.md]
  - what: смежные термины домена контакт-центра с основанием смешения
    from: словарь домена и материалы кросс-валидации
    to: taxonomy/domain-glossary.yaml
  - what: уровни источников знания, формы доказательства и правило разрешения конфликта источников
    from: исследование извлечения знания (лестница готовности корпуса, матрица стратегий, приоритет модификаторов)
    to: taxonomy/source-tiers.yaml
    note: >-
      отраслевая семиуровневая иерархия сужена до четырёх уровней среза;
      уровни вне среза перечислены явно в out_of_slice, чтобы ни одна ветка
      маршрутизации не осталась необъявленной
  - what: состав и формулировочные правила проекций документа
    from: практический раздел мета-модели (проекции как три чтения одного артефакта)
    to: taxonomy/projections.yaml
    note: >-
      существовавшие V-BIZ, V-APPROVE, V-DEV сохранены без переименования и
      дополнены V-CONTRACT (чтение для технического задания)
  - what: определения метрик M-1…M-5 и MP-1…MP-6
    from: практические разделы мета-модели и таксономии процессов
    to: evaluation/metrics.yaml

# 2. Преобразовано: нормативный текст стал структурой, которую исполняет
#    скрипт, а не читает человек.
transformed:
  - what: контракты C-IN, C-CORE, C-OUT, C-CL, C-RK как текстовые описания
    to: contracts/*.schema.json
    form: JSON Schema, проверяемая валидатором
  - what: описание маршрута P-01 → P-02 → P-03 прозой
    to: routes/rg-bcreq-v1.yaml
    form: граф узлов и рёбер с предикатами перехода
  - what: правила SK-0…SK-10 (структура навыка)
    to: .gigacode/skills/*/SKILL.md
    form: шесть обязательных разделов и frontmatter с полями GigaCode name и description
  - what: явная оркестрация маршрута и безопасная диагностика
    to: [.gigacode/skills/rg-bcreq-v1-dispatcher/SKILL.md, .gigacode/skills/ba-debug-orchestrator/SKILL.md]
    form: ручные GigaCode skills с task-rooted и DEBUG-rooted состоянием
  - what: правила гейтов GT-1…GT-6 и порядок G-self → G-mach → G-human
    to: [evaluation/g-mach-checklist.md, evaluation/g-human-checklist.md, tools/validate-package.py]
    form: исполняемые проверки для машины, отмечаемый список для человека
  - what: правила Golden Set EP-G1…EP-G7
    to: golden/cases.yaml
    form: индекс случаев с ожиданиями, отбираемый машинным гейтом без чтения markdown
    note: >-
      EP-G7 переведено в исполняемый вид: каждая пара confusable_with словаря
      домена обязана иметь отрицательный случай, что проверяется валидатором
  - what: правила следа EP-R4, EP-R8 и лист прогона
    to: [routes/run-sheet-template.yaml, contracts/c-rk.schema.json]
    form: append-only перечень микро-событий, отдельный пользовательский результат и проекция передачи работы

# 3. Отброшено: во время выполнения не используется. Отбрасывание —
#    сознательное решение компиляции, а не пропуск (Анти-Инфляция).
discarded:
  - what: исследовательские тексты модулей (00-*, 10-*, 20-*, 30-*, 40-*, 50-*)
    why: нормативные следствия из них уже вынесены в правила навыков и схемы; копия текста удваивала бы источник истины
  - what: журналы прогонов и черновики запросов к моделям
    why: материал получения правил, а не сами правила
  - what: 20 из 31 операции и 22 из 33 навыков таксономии
    why: маршрут среза их не проходит; словари сохранены целиком, скомпилированы только применимые (Анти-Инфляция)
  - what: процессы P-04…P-10 и классы артефактов A-FR, A-TZ, A-US, A-UC, A-SPEC, A-DIAG, A-REP
    why: за границей вертикального среза MVP; внесены в бэклог масштабирования
  - what: организационные материалы Source-репозитория (карта артефактов, бэклог, история решений)
    why: управляют развитием модели, а не исполнением маршрута

# Обратная связь: Source https://github.com/G-Ivan-A/hybrid-Intelligence-lab
# остаётся SSOT развивающейся модели. Расхождение в спутнике исправляется
# задачей Source-репозитория и новой компиляцией,
# а не правкой копии в спутнике.
feedback:
  rule: правка нормативного содержания в спутнике — дефект процесса
  channel: задача в https://github.com/G-Ivan-A/hybrid-Intelligence-lab с указанием артефакта пакета и наблюдения из прогона
  recompilation: смена source.revision и compiled_at во всех затронутых файлах
