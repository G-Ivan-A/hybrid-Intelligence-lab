# Скелет ядра требований A-CORE. Проверяется contracts/c-core.schema.json.
# Элемент без source_ref ядру не принадлежит: на ссылке держится вся дальнейшая
# проверка происхождения требования.
artifact_class: A-CORE
state: draft                  # draft | validated | needs-clarification
task_id: TASK-0000
products:
  - marker: А
    domain: "<domain из taxonomy/mango-products.yaml>"
    capability: "<capability той же ветви>"
    feature: "<feature той же capability>"
    atomic_function: "<atomic function той же capability>"
    profile: "<профиль из taxonomy/products.yaml>"
    owner: "<роль>"
product_attribution:
  status: confirmed
  confirmed_by: "<бизнес-аналитик>"
  confirmed_at: "<ISO-8601>"
  decision_ref: "<ссылка на решение G-human в n0>"
  binding_digest: "sha256:<64 hex символа>"
entities:
  - {id: ENT-01, name: "<сущность>", glossary_term: "<термин словаря или пусто>", source_ref: {source_id: SRC-01, locator: "<локатор>", quote: "<дословная цитата>"}}
actors:
  - {id: ACT-01, role: "<роль>", kind: human, source_ref: {source_id: SRC-01, locator: "<локатор>", quote: "<цитата>"}}
statements:
  - {id: ST-01, text: "<утверждение>", slot: S-FR, atomic: true, product_marker: А, source_ref: {source_id: SRC-01, locator: "<локатор>", quote: "<цитата>"}}
constraints: []
metrics: []
ambiguities:
  - {id: AMB-01, target_id: ST-01, kind: quantitative, severity: blocker, text: "<в чём неоднозначность>"}
