name: validate-cline-package

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package and every submitted BCREQ
        run: python tools/run_task.py verify-ci
