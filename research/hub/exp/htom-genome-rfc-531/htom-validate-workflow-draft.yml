# Черновик `templates/htom/.github/workflows/validate.yml` (G-02, issue #531).
#
# «Иммунная система» генома должна запускаться сама, а не по памяти автора PR.
# Шаги намеренно минимальны: геном не знает стека HTOM-команды и не должен
# навязывать ей линтеры и тесты продукта — это зона `templates/spoke/`.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n tools/*.sh

      - name: Validate repository structure
        run: ./tools/validate-repository-structure.sh
